<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaxPal - AI Tax Assistant</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'Noto Sans SC', 'ui-sans-serif', 'sans-serif'],
              display: ['Manrope', 'Noto Sans SC', 'ui-sans-serif', 'sans-serif']
            },
            colors: {
              tide: {
                50: '#eef4ff',
                100: '#dbe7ff',
                200: '#b8ceff',
                300: '#8eb0ff',
                400: '#618df7',
                500: '#3f6fe8',
                600: '#2f57c6',
                700: '#2648a0',
                800: '#223d83',
                900: '#223666'
              }
            },
            animation: {
              drift: 'drift 12s ease-in-out infinite',
              'pulse-soft': 'pulseSoft 2.4s ease-in-out infinite'
            },
            keyframes: {
              drift: {
                '0%, 100%': { transform: 'translate3d(0, 0, 0)' },
                '50%': { transform: 'translate3d(0, -8px, 0)' }
              },
              pulseSoft: {
                '0%, 100%': { opacity: '0.45' },
                '50%': { opacity: '1' }
              }
            }
          }
        }
      };
    </script>

    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        font-family: 'Manrope', 'Noto Sans SC', sans-serif;
        color: #0f172a;
        background: #f8fafc;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      ::selection {
        background: rgba(47, 87, 198, 0.2);
      }

      ::-webkit-scrollbar {
        width: 11px;
      }

      ::-webkit-scrollbar-track {
        background: #edf2fb;
      }

      ::-webkit-scrollbar-thumb {
        background: #9db5ef;
        border-radius: 999px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #668cd9;
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script src="./App.js"></script>

    <script>
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(App));
    </script>
  </body>
</html>
