<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaxPal - AI Tax Assistant</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Sora', 'ui-sans-serif', 'sans-serif'],
              display: ['Fraunces', 'Georgia', 'serif']
            },
            colors: {
              tide: {
                50: '#eefbf9',
                100: '#d5f4ee',
                200: '#afe8de',
                300: '#7bd8ca',
                400: '#44bfae',
                500: '#249b8d',
                600: '#147c72',
                700: '#0f635d',
                800: '#104f4b',
                900: '#103f3e'
              }
            },
            animation: {
              drift: 'drift 12s ease-in-out infinite',
              'pulse-soft': 'pulseSoft 2.4s ease-in-out infinite'
            },
            keyframes: {
              drift: {
                '0%, 100%': { transform: 'translate3d(0, 0, 0)' },
                '50%': { transform: 'translate3d(0, -14px, 0)' }
              },
              pulseSoft: {
                '0%, 100%': { opacity: '0.45' },
                '50%': { opacity: '1' }
              }
            }
          }
        }
      };
    </script>

    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        font-family: 'Sora', sans-serif;
        color: #0f172a;
        background: #f4fbf9;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      ::selection {
        background: rgba(20, 124, 114, 0.18);
      }

      ::-webkit-scrollbar {
        width: 11px;
      }

      ::-webkit-scrollbar-track {
        background: #e8f2ef;
      }

      ::-webkit-scrollbar-thumb {
        background: #89c9bf;
        border-radius: 999px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #4fa99c;
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script src="./App.js"></script>

    <script>
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(App));
    </script>
  </body>
</html>
